<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブログ | 仏閣めぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7eed9;
  --cream-deep:#efe0bf;
  --red:#c0281d;
  --red-dark:#8a1a14;
  --ink:#3a1f1a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.9;
}
a{color:inherit}
a:focus-visible{outline:3px solid var(--red);outline-offset:3px}

header{background:var(--red);color:var(--cream);border-bottom:6px solid var(--red-dark)}
.bar{
  max-width:960px;margin:0 auto;padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;
}
.logo{font-size:1.4rem;font-weight:800;letter-spacing:.2em;text-decoration:none}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current]{border-bottom-color:var(--cream)}

main{max-width:620px;margin:0 auto;padding:48px 20px 56px}
h1{
  font-size:1.6rem;color:var(--red);
  border-left:8px solid var(--red);padding-left:14px;margin-bottom:8px;
}
.sub{margin-bottom:32px;font-size:.95rem}

.timeline{
  border:2px solid var(--red);
  background:var(--cream-deep);
}
.post{padding:20px 24px;border-bottom:1px solid var(--red)}
.post:last-child{border-bottom:none}
.post time{
  display:block;font-size:.85rem;font-weight:600;
  color:var(--red-dark);letter-spacing:.08em;margin-bottom:4px;
}
.post p{font-size:1rem}

footer{
  background:var(--red-dark);color:var(--cream);
  text-align:center;padding:28px 20px;font-size:.9rem;letter-spacing:.1em;
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">仏閣めぐり</a>
    <nav aria-label="メインメニュー">
      <a href="index.html">ホーム</a>
      <a href="blog.html" aria-current="page">ブログ</a>
      <a href="gallery.html">ギャラリー</a>
      <a href="about.html">about</a>
    </nav>
  </div>
</header>

<main>
  <h1>ブログ</h1>
  <p class="sub">勉強の進み具合を、日付と日記でひとこと。</p>

  <div class="timeline">
    <!-- 新しい投稿はここ（先頭）に足していく -->
    <article class="post">
      <time datetime="2026-10-26">2026.10.26</time>
      <p>今日は寺院建築の屋根の種類を勉強した。入母屋造と寄棟造の違いがやっと区別できるようになってきた。</p>
    </article>
    <article class="post">
      <time datetime="2026-10-24">2026.10.24</time>
      <p>山門と仏殿の役割をノートにまとめた。禅宗のお寺は配置に決まりがあって面白い。</p>
    </article>
    <article class="post">
      <time datetime="2026-10-21">2026.10.21</time>
      <p>五重塔の構造を調べた。心柱が揺れを抑える仕組みはとても不思議。もっと詳しく知りたい。</p>
    </article>
    <article class="post">
      <time datetime="2026-10-18">2026.10.18</time>
      <p>仏像の種類（如来・菩薩・明王・天）の見分け方を復習。持ち物と印相がポイント。</p>
    </article>
  </div>
</main>

<footer>© 仏閣めぐり</footer>

</body>
</html>
