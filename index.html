<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仏閣めぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f7eed9;
  --cream-deep:#efe0bf;
  --red:#c0281d;
  --red-dark:#8a1a14;
  --ink:#3a1f1a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.9;
}
a{color:inherit}
a:focus-visible{outline:3px solid var(--red);outline-offset:3px}

/* header */
header{
  background:var(--red);
  color:var(--cream);
  border-bottom:6px solid var(--red-dark);
}
.bar{
  max-width:960px;margin:0 auto;padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;
}
.logo{font-size:1.4rem;font-weight:800;letter-spacing:.2em;text-decoration:none}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current]{border-bottom-color:var(--cream)}

/* hero */
.hero{
  background:var(--red);
  color:var(--cream);
  padding:56px 20px 0;
  overflow:hidden;
}
.hero-in{
  max-width:960px;margin:0 auto;
  display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;
}
.hero h1{
  font-size:clamp(2.2rem,6vw,3.8rem);
  font-weight:800;line-height:1.35;letter-spacing:.08em;
  writing-mode:vertical-rl;
  height:15em;
  margin-bottom:40px;
  justify-self:end;
}
.hero p{max-width:26em;margin-bottom:40px;font-size:1.05rem}
.hero svg{width:min(240px,42vw);height:auto;display:block}
.ground{height:22px;background:var(--cream)}

/* sections */
main{max-width:960px;margin:0 auto;padding:64px 20px 40px}
.lead{max-width:34em;margin-bottom:56px}
.lead h2{
  font-size:1.5rem;color:var(--red);
  border-left:8px solid var(--red);padding-left:14px;margin-bottom:16px;
}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.paths a{
  display:block;text-decoration:none;
  background:var(--cream-deep);
  border:2px solid var(--red);
  padding:26px 24px;
  transition:background .2s,color .2s;
}
.paths a:hover{background:var(--red);color:var(--cream)}
.paths h3{font-size:1.25rem;margin-bottom:6px}
.paths p{font-size:.95rem;line-height:1.7}

footer{
  background:var(--red-dark);color:var(--cream);
  text-align:center;padding:28px 20px;font-size:.9rem;letter-spacing:.1em;
}

@media (max-width:600px){
  .hero-in{grid-template-columns:1fr}
  .hero h1{writing-mode:horizontal-tb;height:auto;justify-self:start;margin-bottom:16px}
  .hero svg{justify-self:end}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">仏閣めぐり</a>
    <nav aria-label="メインメニュー">
      <a href="index.html" aria-current="page">ホーム</a>
      <a href="blog.html">ブログ</a>
      <a href="gallery.html">ギャラリー</a>
      <a href="about.html">about</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <div>
      <p>お寺の屋根の反り、朱塗りの柱、静かな境内。<br>仏閣について学んだことと、描いた絵を置いていく場所です。</p>
    </div>
    <h1>静けさの<br>建築を<br>歩く</h1>
    <svg viewBox="0 0 200 260" role="img" aria-label="鳥居のシルエット" fill="#f7eed9">
      <path d="M0 26 Q100 52 200 26 L192 46 Q100 64 8 46 Z"/>
      <rect x="20" y="50" width="160" height="10"/>
      <rect x="94" y="58" width="12" height="28"/>
      <rect x="40" y="84" width="120" height="11"/>
      <path d="M44 56 H62 L60 260 H46 Z"/>
      <path d="M138 56 H156 L154 260 H140 Z"/>
    </svg>
  </div>
</section>
<div class="ground"></div>

<main>
  <div class="lead">
    <h2>はじめに</h2>
    <p>このサイトでは、お寺や仏閣の建築・歴史・仏像について勉強したことを記録しています。参拝した場所のスケッチや、お寺をテーマにした漫画・イラストも載せていきます。</p>
  </div>

  <div class="paths">
    <a href="blog.html">
      <h3>ブログ</h3>
      <p>勉強の進み具合を、日付と日記でひとこと。</p>
    </a>
    <a href="gallery.html">
      <h3>ギャラリー</h3>
      <p>お寺にまつわる漫画とイラストの置き場。</p>
    </a>
    <a href="about.html">
      <h3>about</h3>
      <p>このサイトと、描いている人について。</p>
    </a>
  </div>
</main>

<footer>© 仏閣めぐり</footer>

</body>
</html>
